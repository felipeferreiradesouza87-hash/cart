<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Hello Kitty Carta</title>
<style>
    body {
        background: #ffe6f2;
        font-family: 'Comic Sans MS', cursive;
        text-align: center;
        margin: 0;
        padding-top: 40px;
    }

    /* ENVELOPE */
    .envelope {
        width: 230px;
        height: 160px;
        background: #ffb6c1;
        margin: 0 auto;
        position: relative;
        border-radius: 12px;
        box-shadow: 0 0 15px #ff9ec9;
        cursor: pointer;
        transition: transform 0.6s ease-out, opacity 0.5s;
    }

    .envelope:before {
        content: "💌";
        font-size: 50px;
        position: absolute;
        top: 50px;
        left: 90px;
    }

    .btn-envelope {
        width: 45px;
        height: 45px;
        background: #ff69b4;
        border-radius: 50%;
        border: 3px solid white;
        position: absolute;
        bottom: -20px;
        left: 92px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 22px;
        color: white;
        cursor: pointer;
        box-shadow: 0 0 8px #ff4b9f;
        transition: 0.3s;
    }

    .btn-envelope:hover {
        transform: scale(1.15);
        background: #ff3c8f;
    }

    /* CARTA */
    .carta {
        width: 330px;
        min-height: 380px;
        background: white;
        margin: 30px auto;
        padding: 25px;
        border-radius: 18px;
        border: 4px solid #ff8aba;
        box-shadow: 0 0 20px #ffb5d9;
        transform: scale(0);
        opacity: 0;
        transition: transform 0.6s ease-out, opacity 0.6s;
        position: relative;
        overflow: hidden;
    }

    /* CARTA ABERTA */
    .carta.aberta {
        transform: scale(1.07);
    }

    /* DECORAÇÕES DA CARTA */
    .carta:before {
        content: "✨🎀✨";
        font-size: 25px;
        position: absolute;
        top: -18px;
        left: 50%;
        transform: translateX(-50%);
        background: #ffe3f4;
        padding: 0 12px;
        border-radius: 20px;
        color: #ff5fa9;
    }

    .carta:after {
        content: "🌸";
        font-size: 25px;
        position: absolute;
        bottom: -18px;
        left: 50%;
        transform: translateX(-50%);
        background: #ffe3f4;
        padding: 0 12px;
        border-radius: 20px;
        color: #ff5fa9;
    }

    /* CANTO FLORIDO */
    .flor {
        position: absolute;
        font-size: 28px;
        color: #ff60a8;
        opacity: 0;
        transform: scale(0.6);
        transition: 0.6s ease;
    }

    .carta.aberta .flor {
        opacity: 1;
        transform: scale(1);
    }

    .f1 { top: 10px; left: 10px; }
    .f2 { top: 10px; right: 10px; }
    .f3 { bottom: 10px; left: 10px; }
    .f4 { bottom: 10px; right: 10px; }

    /* TEXTO DA CARTA */
    .conteudo {
        opacity: 0;
        transition: opacity 0.7s ease;
    }

    .carta.aberta .conteudo {
        opacity: 1;
    }

    /* BOTÃO SIMPLES “ABRIR CARTA” */
    .btn-carta {
        display: inline-block;
        background: #ff69b4;
        color: white;
        padding: 12px 28px;
        font-size: 18px;
        border-radius: 25px;
        border: 2px solid white;
        box-shadow: 0 0 8px #ff4b9f;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 15px;
    }

    .btn-carta:hover {
        transform: scale(1.05);
        background: #ff3b9c;
        box-shadow: 0 0 12px #ff0f83;
    }

</style>
</head>
<body>

<!-- ENVELOPE -->
<div class="envelope" id="envelope">
    <div class="btn-envelope" onclick="abrirEnvelope()">❤</div>
</div>

<!-- CARTA -->
<div class="carta" id="carta">
    <div class="flor f1">🌸</div>
    <div class="flor f2">🌸</div>
    <div class="flor f3">🌸</div>
    <div class="flor f4">🌸</div>

    <div class="conteudo">
        <h2 style="color:#ff4b9f; margin-bottom:10px;">Carta Especial 💖</h2>
        <p style="color:#333; font-size:17px;">
            faço essa carta com muito amor e carinho, pq te amo de montão! e pra mim vc é a pessoa mais importante desse mundo, agradeço por todos esses momentos juntinhos, espero recordar mais memorias com vc minha gatinha linda🎀💗
        </p>
    </div>

    <!-- BOTÃO SIMPLES -->
    <div class="btn-carta" onclick="abrirCarta()">Abrir Carta 💖</div>
</div>

<script>
function abrirEnvelope() {
    const envelope = document.getElementById("envelope");
    const carta = document.getElementById("carta");

    envelope.style.transform = "translateY(-200px) scale(0.7)";
    envelope.style.opacity = "0";

    setTimeout(() => {
        carta.style.transform = "scale(1)";
        carta.style.opacity = "1";
    }, 500);
}

function abrirCarta() {
    const carta = document.getElementById("carta");
    carta.classList.add("aberta");  // ativa animação da carta e mostra conteúdo
}
</script>

</body>
</html>
